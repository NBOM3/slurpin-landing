    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            opacity: 0;
            transform: translateY(24px);
            animation: fadeUp 1s cubic-bezier(.16,1,.3,1) .15s forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 800;
            font-size: clamp(2rem, 6vw, 4rem);
            text-transform: uppercase;
            letter-spacing: .12em;
            text-align: center;
            background: linear-gradient(135deg, #c084fc, #f472b6, #c084fc);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            filter: drop-shadow(0 0 24px rgba(192, 132, 252, .45));
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .gif-frame {
            position: relative;
            border-radius: 16px;
            overflow: visible;
        }

        .gif-frame::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 20px;
            background: linear-gradient(135deg, #c084fc, #f472b6, #818cf8, #c084fc);
            background-size: 300% 300%;
            animation: glowRotate 5s ease-in-out infinite;
            filter: blur(18px);
            opacity: .55;
            z-index: 0;
        }

        @keyframes glowRotate {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .gif-frame::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(192,132,252,.3), rgba(244,114,182,.3));
            z-index: 1;
            pointer-events: none;
        }

        .gif-frame img {
            position: relative;
            z-index: 2;
            display: block;
            max-width: min(100vw, 750px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.08);
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .18;
            pointer-events: none;
            z-index: -1;
        }
        .blob-1 { width: 420px; height: 420px; background: #7c3aed; top: -10%; left: -8%; }
        .blob-2 { width: 360px; height: 360px; background: #ec4899; bottom: -12%; right: -6%; }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            padding: .75rem 1.75rem;
            border-radius: 12px;
            background: rgba(88, 101, 242, .15);
            border: 1px solid rgba(88, 101, 242, .35);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            letter-spacing: .03em;
            transition: all .3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .discord-btn:hover {
            background: rgba(88, 101, 242, .3);
            border-color: rgba(88, 101, 242, .6);
            box-shadow: 0 0 20px rgba(88, 101, 242, .25);
            transform: translateY(-2px);
        }

        .discord-btn svg {
            width: 22px;
            height: 22px;
            fill: #5865f2;
        }
    </style>
